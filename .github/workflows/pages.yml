name: GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Check public source boundaries
        run: python scripts/check-public-tree.py
      - name: Install client
        working-directory: app
        run: npm ci
      - name: Prepare public example
        working-directory: app
        run: npm run sample
      - name: Build preview
        working-directory: app
        run: npm run build -- --mode pages
      - name: Check reader
        working-directory: app
        run: npm run test:markdown
      - name: Check deployment paths
        working-directory: app
        run: npm run test:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
