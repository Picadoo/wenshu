[package]
name = "wenshu"
version = "0.1.0"
description = "文枢 open source research library"
authors = ["Picadoo"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "wenshu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
